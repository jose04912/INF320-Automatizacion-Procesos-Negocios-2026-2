# n8n autoalojado (opcional/avanzado) — INF 320 Automatización de Procesos de Negocios (2026-2)
# Uso: docker compose -f docker/docker-compose.yml up -d   →   http://localhost:5678
services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: n8n
      POSTGRES_PASSWORD: n8n_local_pw
      POSTGRES_DB: n8n
    volumes:
      - n8n_pg_data:/var/lib/postgresql/data

  n8n:
    image: n8nio/n8n:latest
    restart: unless-stopped
    ports:
      - "5678:5678"
    environment:
      DB_TYPE: postgresdb
      DB_POSTGRESDB_HOST: postgres
      DB_POSTGRESDB_DATABASE: n8n
      DB_POSTGRESDB_USER: n8n
      DB_POSTGRESDB_PASSWORD: n8n_local_pw
      N8N_SECURE_COOKIE: "false"
      GENERIC_TIMEZONE: America/Panama
    volumes:
      - n8n_data:/home/node/.n8n
    depends_on:
      - postgres

volumes:
  n8n_pg_data:
  n8n_data:
