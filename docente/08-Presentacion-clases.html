<title>Automatización de Procesos de Negocios — INF 320</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@600;700;800&family=Karla:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600;700&display=swap">
<style>
  :root{
    --bg:#F1F4ED;
    --surface:#FFFFFF;
    --surface-2:#E4EAE0;
    --ink:#1B2419;
    --ink-soft:#3A4636;
    --muted:#6B7566;
    --line:#D6DCC9;
    --emerald:#1B7A57;
    --emerald-strong:#145E43;
    --marigold:#A66A0C;
    --marigold-strong:#8A570A;
    --exam:#963C2A;
    --exam-bg:#F3E1DB;
    --shadow:0 18px 40px -22px rgba(20,30,20,.35);
  }
  @media (prefers-color-scheme:dark){
    :root:not([data-theme="light"]){
      --bg:#141F1A;
      --surface:#1C2A23;
      --surface-2:#24352C;
      --ink:#EAEFE4;
      --ink-soft:#C7D2BE;
      --muted:#8FA085;
      --line:#33453A;
      --emerald:#3FBF95;
      --emerald-strong:#63D3AE;
      --marigold:#F2C168;
      --marigold-strong:#F6D28C;
      --exam:#E29079;
      --exam-bg:#3B251D;
      --shadow:0 24px 60px -20px rgba(0,0,0,.6);
    }
  }
  :root[data-theme="dark"]{
    --bg:#141F1A;
    --surface:#1C2A23;
    --surface-2:#24352C;
    --ink:#EAEFE4;
    --ink-soft:#C7D2BE;
    --muted:#8FA085;
    --line:#33453A;
    --emerald:#3FBF95;
    --emerald-strong:#63D3AE;
    --marigold:#F2C168;
    --marigold-strong:#F6D28C;
    --exam:#E29079;
    --exam-bg:#3B251D;
    --shadow:0 24px 60px -20px rgba(0,0,0,.6);
  }

  *{box-sizing:border-box;}
  html,body{height:100%;}
  body{
    margin:0;background:var(--bg);color:var(--ink);
    font-family:"Karla",system-ui,sans-serif;
    overflow:hidden;-webkit-font-smoothing:antialiased;
  }
  ::selection{background:var(--marigold);color:#1B2419;}
  h1,h2,h3{font-family:"Big Shoulders Display",system-ui,sans-serif;font-weight:800;margin:0;text-wrap:balance;text-transform:uppercase;letter-spacing:.01em;}
  .mono{font-family:"IBM Plex Mono",ui-monospace,monospace;}
  button{cursor:pointer;font-family:inherit;}
  :focus-visible{outline:2px solid var(--marigold-strong);outline-offset:3px;border-radius:6px;}

  #app{position:relative;height:100dvh;width:100%;}

  header.topbar{
    position:fixed;top:0;left:0;right:0;z-index:40;
    display:flex;align-items:center;justify-content:space-between;
    padding:14px clamp(16px,4vw,40px);pointer-events:none;
  }
  header.topbar > *{pointer-events:auto;}
  .course-tag{
    display:flex;align-items:center;gap:10px;
    font-family:"IBM Plex Mono";font-size:12px;letter-spacing:.06em;color:var(--muted);text-transform:uppercase;
  }
  .course-tag .dot{width:7px;height:7px;border-radius:50%;background:var(--emerald);}
  .topbar-right{display:flex;align-items:center;gap:8px;}
  .icon-btn{
    display:flex;align-items:center;justify-content:center;width:36px;height:36px;border-radius:10px;
    border:1px solid var(--line);background:var(--surface);color:var(--ink-soft);
    font-size:15px;transition:transform .15s ease,border-color .15s ease;
  }
  .icon-btn:hover{border-color:var(--marigold);color:var(--ink);}
  .icon-btn:active{transform:scale(.94);}
  .counter{font-family:"IBM Plex Mono";font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums;min-width:52px;text-align:right;}

  #stage{position:relative;height:100%;width:100%;display:flex;align-items:center;justify-content:center;}
  .slide{
    position:absolute;inset:0;display:flex;align-items:center;justify-content:center;
    padding:clamp(64px,8vh,96px) clamp(16px,6vw,72px) clamp(56px,7vh,72px);
    opacity:0;transform:translateY(14px) scale(.99);transition:opacity .38s ease, transform .38s ease;pointer-events:none;
  }
  .slide.active{opacity:1;transform:translateY(0) scale(1);pointer-events:auto;z-index:5;}
  @media (prefers-reduced-motion:reduce){.slide{transition:opacity .01s linear;transform:none;}}

  .card{
    width:100%;max-width:1180px;max-height:100%;overflow-y:auto;
    background:var(--surface);border:1px solid var(--line);border-radius:16px;
    box-shadow:var(--shadow);padding:clamp(28px,4vw,52px) clamp(28px,5vw,64px);position:relative;
  }
  .card::-webkit-scrollbar{width:8px;}
  .card::-webkit-scrollbar-thumb{background:var(--line);border-radius:8px;}

  .week-node{
    position:absolute;top:clamp(20px,3vw,36px);right:clamp(24px,4vw,52px);
    width:clamp(52px,6vw,72px);height:clamp(52px,6vw,72px);border-radius:50%;
    border:3px solid var(--emerald);display:flex;align-items:center;justify-content:center;
    font-family:"IBM Plex Mono";font-weight:700;font-size:clamp(16px,2vw,22px);color:var(--emerald);
  }

  .eyebrow{
    font-family:"IBM Plex Mono";font-size:12.5px;letter-spacing:.12em;text-transform:uppercase;
    color:var(--marigold-strong);margin-bottom:12px;display:flex;align-items:center;gap:10px;
  }
  .eyebrow .sep{color:var(--line);}

  .badges{display:flex;flex-wrap:wrap;gap:8px;margin:12px 0 4px;}
  .badge{font-family:"IBM Plex Mono";font-size:11.5px;letter-spacing:.05em;text-transform:uppercase;padding:5px 11px;border-radius:999px;border:1px solid var(--line);color:var(--ink-soft);}
  .badge.exam{background:var(--exam-bg);color:var(--exam);border-color:transparent;font-weight:700;}
  .badge.checkpoint{background:var(--surface-2);color:var(--marigold-strong);border-color:transparent;font-weight:700;}

  h2.slide-title{font-size:clamp(24px,3.2vw,38px);line-height:1.06;max-width:26ch;padding-right:80px;}

  .obj-row{display:flex;flex-wrap:wrap;gap:8px;margin:18px 0 26px;}
  .obj-chip{
    display:flex;align-items:flex-start;gap:7px;background:var(--surface-2);border-radius:10px;
    padding:8px 12px;font-size:13.5px;color:var(--ink-soft);max-width:280px;line-height:1.4;
  }
  .obj-chip .ck{color:var(--emerald);font-weight:700;flex:none;}

  .field-label{font-family:"IBM Plex Mono";font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);margin:0 0 8px;}

  .flow{display:flex;align-items:stretch;gap:0;margin-top:8px;flex-wrap:wrap;}
  .flow-step{
    flex:1 1 220px;background:var(--surface-2);border-radius:12px;padding:16px 18px;
    display:flex;flex-direction:column;gap:8px;min-width:220px;
  }
  .flow-arrow{
    display:flex;align-items:center;justify-content:center;flex:0 0 40px;color:var(--marigold);font-size:20px;
  }
  @media (max-width:900px){
    .flow{flex-direction:column;}
    .flow-arrow{transform:rotate(90deg);flex:0 0 24px;}
  }
  .flow-step .step-label{font-family:"IBM Plex Mono";font-size:10.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--emerald-strong);}
  .flow-step p{margin:0;font-size:14px;line-height:1.5;color:var(--ink-soft);}
  .flow-step .quote{font-family:"Karla";font-style:italic;color:var(--ink);font-size:14px;border-left:2px solid var(--marigold);padding-left:9px;margin:2px 0 0;}
  .flow-step .tech{font-size:12.5px;color:var(--marigold-strong);font-weight:700;margin-top:2px;}

  .chips{display:flex;flex-wrap:wrap;gap:7px;margin-top:8px;}
  .chip{font-size:13px;padding:4px 10px;border-radius:8px;background:var(--surface-2);color:var(--ink-soft);}

  .evidence{
    margin-top:18px;display:flex;align-items:center;gap:10px;font-family:"IBM Plex Mono";font-size:13px;color:var(--ink);
    background:var(--surface-2);border:1px dashed var(--emerald);border-radius:10px;padding:10px 14px;
  }
  .evidence b{color:var(--emerald-strong);}

  /* ---------- Rules ("reglas del juego") slides ---------- */
  .rule-grid{
    display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));
    gap:clamp(14px,2vw,20px);margin-top:clamp(20px,3vw,28px);
  }
  .rule-card{
    border-radius:12px;padding:16px 18px;background:var(--surface-2);
    border-left:4px solid var(--line);
  }
  .rule-card h4{
    font-family:"IBM Plex Mono";font-size:12px;letter-spacing:.06em;text-transform:uppercase;
    margin:0 0 10px;color:var(--ink-soft);text-transform:none;
  }
  .rule-card ul{list-style:none;margin:0;padding:0;}
  .rule-card li{
    font-size:14px;line-height:1.5;color:var(--ink-soft);padding:5px 0 5px 20px;position:relative;font-family:"Karla";
  }
  .rule-card li::before{position:absolute;left:0;top:5px;font-weight:700;font-size:12px;}
  .rule-card.tone-info{border-left-color:var(--muted);}
  .rule-card.tone-info li::before{content:"—";color:var(--muted);}
  .rule-card.tone-allow{border-left-color:var(--emerald);}
  .rule-card.tone-allow h4{color:var(--emerald-strong);}
  .rule-card.tone-allow li::before{content:"✓";color:var(--emerald-strong);}
  .rule-card.tone-warn{border-left-color:var(--marigold);}
  .rule-card.tone-warn h4{color:var(--marigold-strong);}
  .rule-card.tone-warn li::before{content:"◆";color:var(--marigold-strong);}
  .rule-card.tone-forbid{border-left-color:var(--exam);background:var(--exam-bg);}
  .rule-card.tone-forbid h4{color:var(--exam);}
  .rule-card.tone-forbid li::before{content:"✕";color:var(--exam);}
  .rule-card.tone-forbid li{color:var(--ink);}

  /* module divider */
  .divider-card{text-align:left;max-width:900px;background:transparent;border:none;box-shadow:none;padding:0;}
  .divider-num{font-family:"Big Shoulders Display";font-weight:800;font-size:clamp(70px,13vw,160px);color:var(--emerald);line-height:.8;}
  .divider-title{font-size:clamp(28px,4.6vw,50px);margin-top:4px;max-width:18ch;}
  .divider-meta{margin-top:16px;font-family:"IBM Plex Mono";font-size:14px;color:var(--muted);display:flex;gap:18px;flex-wrap:wrap;}
  .divider-meta span{color:var(--marigold-strong);}
  .divider-weeks{margin-top:26px;display:flex;gap:10px;flex-wrap:wrap;}
  .week-pill{font-family:"IBM Plex Mono";font-size:13px;padding:7px 14px;border-radius:999px;border:1px solid var(--line);color:var(--ink-soft);background:var(--surface);}

  /* intro */
  .intro-card{max-width:940px;background:transparent;border:none;box-shadow:none;text-align:left;}
  .intro-kicker{font-family:"IBM Plex Mono";font-size:13px;letter-spacing:.14em;text-transform:uppercase;color:var(--marigold-strong);margin-bottom:16px;}
  .intro-title{font-size:clamp(34px,6vw,66px);line-height:.98;}
  .intro-title em{color:var(--emerald);font-style:normal;}
  .intro-sub{margin-top:16px;font-size:clamp(15px,1.8vw,18px);color:var(--ink-soft);max-width:52ch;line-height:1.55;font-family:"Karla";text-transform:none;}
  .intro-facts{margin-top:clamp(26px,4vw,40px);display:grid;grid-template-columns:repeat(3,1fr);gap:1px;background:var(--line);border:1px solid var(--line);border-radius:14px;overflow:hidden;}
  .fact{background:var(--surface);padding:16px 18px;}
  .fact .k{font-family:"IBM Plex Mono";font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);}
  .fact .v{margin-top:6px;font-size:15px;color:var(--ink);font-weight:600;line-height:1.4;font-family:"Karla";}
  @media (max-width:700px){.intro-facts{grid-template-columns:1fr 1fr;}}

  .eval-bar{height:34px;border-radius:8px;overflow:hidden;display:flex;margin-top:10px;border:1px solid var(--line);}
  .eval-bar > div{display:flex;align-items:center;justify-content:center;font-family:"IBM Plex Mono";font-size:12px;color:#fff;font-weight:600;}
  .two-col{display:grid;grid-template-columns:1fr 1fr;gap:clamp(24px,4vw,48px);margin-top:20px;}
  @media (max-width:820px){.two-col{grid-template-columns:1fr;}}
  .list-clean{list-style:none;margin:0;padding:0;}
  .list-clean li{padding:9px 0;border-bottom:1px solid var(--line);font-size:14.5px;color:var(--ink-soft);display:flex;gap:10px;}
  .list-clean li:last-child{border-bottom:none;}
  .list-clean li::before{content:"—";color:var(--emerald);flex:none;}

  .navctl{position:fixed;left:0;right:0;bottom:0;display:flex;align-items:center;justify-content:space-between;padding:14px clamp(16px,4vw,40px);z-index:40;pointer-events:none;}
  .navctl > *{pointer-events:auto;}
  .nav-btn{
    display:flex;align-items:center;gap:8px;background:var(--surface);border:1px solid var(--line);color:var(--ink);
    padding:9px 16px;border-radius:999px;font-size:13.5px;font-weight:700;box-shadow:var(--shadow);
    transition:transform .15s ease,opacity .15s ease;font-family:"Karla";
  }
  .nav-btn:hover{transform:translateY(-2px);}
  .nav-btn:active{transform:translateY(0);}
  .nav-btn[disabled]{opacity:.35;pointer-events:none;box-shadow:none;}
  .nav-btn .k{font-family:"IBM Plex Mono";font-size:11px;opacity:.6;}

  .progress-track{position:fixed;left:0;right:0;bottom:0;height:4px;display:flex;z-index:39;background:var(--line);}
  .progress-seg{height:100%;background:var(--surface-2);position:relative;cursor:pointer;flex:1 1 0;}
  .progress-seg + .progress-seg{border-left:1px solid var(--bg);}
  .progress-seg .fill{position:absolute;inset:0;background:var(--emerald);transform:scaleX(0);transform-origin:left;transition:transform .25s ease;}
  .progress-seg.done .fill{transform:scaleX(1);}
  .progress-seg.current .fill{transform:scaleX(1);}

  #overview{position:fixed;inset:0;z-index:60;background:color-mix(in srgb, var(--bg) 88%, transparent);backdrop-filter:blur(6px);display:none;padding:clamp(24px,5vw,64px);overflow-y:auto;}
  #overview.open{display:block;}
  .ov-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:24px;}
  .ov-head h3{font-size:clamp(20px,3vw,28px);}
  .ov-groups{display:flex;flex-direction:column;gap:28px;max-width:1100px;margin:0 auto;}
  .ov-mod-label{font-family:"IBM Plex Mono";font-size:12px;letter-spacing:.1em;text-transform:uppercase;color:var(--emerald-strong);margin-bottom:10px;}
  .ov-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:10px;}
  .ov-item{text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:12px 14px;color:var(--ink-soft);font-size:13.5px;line-height:1.4;font-family:"Karla";}
  .ov-item:hover{border-color:var(--marigold);color:var(--ink);}
  .ov-item .n{font-family:"IBM Plex Mono";font-size:11px;color:var(--muted);display:block;margin-bottom:4px;}
  .ov-item.current{border-color:var(--emerald);background:var(--surface-2);}

  #shortcuts{position:fixed;bottom:70px;right:clamp(16px,4vw,40px);z-index:61;background:var(--surface);border:1px solid var(--line);border-radius:12px;box-shadow:var(--shadow);padding:16px 18px;font-size:13px;color:var(--ink-soft);display:none;min-width:220px;}
  #shortcuts.open{display:block;}
  #shortcuts h4{font-family:"IBM Plex Mono";font-size:11px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);margin:0 0 10px;}
  #shortcuts .row{display:flex;justify-content:space-between;padding:4px 0;}
  #shortcuts kbd{font-family:"IBM Plex Mono";background:var(--surface-2);border-radius:5px;padding:2px 6px;font-size:11.5px;}
</style>

  <header class="topbar">
    <div class="course-tag"><span class="dot"></span> Automatización de Procesos de Negocios · INF 320</div>

<script>
(function(){
  "use strict";

  var MODULES = [
    {n:1, title:"Introducción a la automatización y análisis de procesos", weeks:"Semanas 1–2", hours:"8 horas", desc:"Qué es la BPA, sus beneficios y su diferencia frente a la reingeniería de procesos (BPR)."},
    {n:2, title:"Herramientas, diseño e implementación de procesos automatizados", weeks:"Semanas 3–5", hours:"12 horas", desc:"Mapeo BPMN, técnicas de análisis de procesos e identificación de oportunidades de automatización."},
    {n:3, title:"Automatización de marketing, ventas, logística y RPA", weeks:"Semanas 6–9", hours:"15 horas", desc:"BPM vs. RPA, plataformas RPA/no-code, integración de sistemas de comercio electrónico."},
    {n:4, title:"Implementación de chatbots y asistentes virtuales", weeks:"Semanas 10–12", hours:"15 horas", desc:"Principios de diseño de workflows, casos de uso en e-commerce y chatbots con IA conversacional."},
    {n:5, title:"Seguridad, monitoreo y optimización continua", weeks:"Semanas 13–15", hours:"10 horas", desc:"Marketing automation, seguridad/gobernanza de datos, KPIs y demo final del proyecto."}
  ];

  var RULES = [
    {title:"Primera clase — Bienvenida y reglas del juego",
      cards:[
        {label:"Agenda de hoy", tone:"info", items:[
          "Bienvenida y presentación del docente",
          "Recorrido del syllabus de INF 320",
          "Reglas del juego del curso (siguientes diapositivas)",
          "Exploración inicial de UiPath, Zapier, Make y Bizagi"
        ]},
        {label:"Antes de la próxima clase", tone:"info", items:[
          "Cuentas educativas/gratuitas creadas en 2 plataformas no-code",

          "Caso real de automatización investigado (tarea de la semana 1)",
          "Traer dudas sobre evaluación o política de IA"
        ]}
      ]},
    {title:"Reglas del juego — Asistencia e integridad académica",
      cards:[
        {label:"Asistencia y puntualidad", tone:"info", items:[

      cards:[

      seg.className = "progress-seg";
      seg.dataset.i = i;
      seg.innerHTML = '<div class="fill"></div>';
      seg.setAttribute("role","button");
      seg.setAttribute("aria-label", "Ir a diapositiva " + (i+1));
      seg.addEventListener("click", function(){ goTo(i); });
      track.appendChild(seg);
    });
  }
  function updateProgress(){
    var segs = track.children;
    for(var i=0;i<segs.length;i++){
      segs[i].classList.toggle("done", i<current);
      segs[i].classList.toggle("current", i===current);
    }
  }

  function buildOverview(){
    var wrap = document.getElementById("ovGroups");
    var html = "";
    var groups = {};
    slides.forEach(function(s,i){
      var label, title;
      if(s.type==="intro"){label="Introducción"; title="Portada del curso";}
      else if(s.type==="rules"){label="Primer día · Reglas del juego"; title=s.data.title;}
      else if(s.type==="overview"){label="Introducción"; title="Metodología y evaluación";}
      else if(s.type==="module"){label="Módulo "+s.data.n; title=s.data.title;}
      else if(s.type==="week"){label="Módulo "+s.data.m; title="Semana "+s.data.w+" · "+s.data.title;}
      else if(s.type==="closing"){label="Cierre"; title="Proyecto integrador y recordatorios";}
      if(!groups[label]) groups[label]=[];
      groups[label].push({i:i, title:title});
    });
    Object.keys(groups).forEach(function(label){
      html += '<div><div class="ov-mod-label">' + label + '</div><div class="ov-grid">';
      groups[label].forEach(function(item){
        html += '<button class="ov-item" data-i="'+item.i+'"><span class="n mono">'+pad(item.i+1)+'</span>'+item.title+'</button>';
      });
      html += '</div></div>';
    });
    wrap.innerHTML = html;
    wrap.querySelectorAll(".ov-item").forEach(function(btn){
      btn.addEventListener("click", function(){
        goTo(parseInt(btn.dataset.i,10));
        closeOverview();
      });
    });
  }
  function markOverviewCurrent(){
    document.querySelectorAll(".ov-item").forEach(function(el){
      el.classList.toggle("current", parseInt(el.dataset.i,10)===current);
    });
  }

  function render(){
    stage.innerHTML = renderSlide(current);
    var el = stage.firstElementChild;
    requestAnimationFrame(function(){ el.classList.add("active"); });
    counterEl.textContent = pad(current+1) + " / " + total;
    btnPrev.disabled = current===0;
    btnNext.disabled = current===total-1;
    updateProgress();
    markOverviewCurrent();
  }
  function goTo(i){ current = Math.max(0, Math.min(total-1, i)); render(); }
  function next(){ if(current<total-1) goTo(current+1); }
  function prev(){ if(current>0) goTo(current-1); }

  btnPrev.addEventListener("click", prev);
  btnNext.addEventListener("click", next);

  var overviewEl = document.getElementById("overview");
  function openOverview(){ buildOverview(); overviewEl.classList.add("open"); document.getElementById("btnCloseOverview").focus(); }
  function closeOverview(){ overviewEl.classList.remove("open"); }
  document.getElementById("btnOverview").addEventListener("click", openOverview);
  document.getElementById("btnCloseOverview").addEventListener("click", closeOverview);

  var shortcutsEl = document.getElementById("shortcuts");
  document.getElementById("btnHelp").addEventListener("click", function(){ shortcutsEl.classList.toggle("open"); });

  document.addEventListener("keydown", function(e){
    if(e.key==="Escape"){ closeOverview(); shortcutsEl.classList.remove("open"); return; }
    if(overviewEl.classList.contains("open")) return;
    if(e.key==="ArrowRight" || e.key===" "){ e.preventDefault(); next(); }
    else if(e.key==="ArrowLeft"){ e.preventDefault(); prev(); }
    else if(e.key==="Home"){ e.preventDefault(); goTo(0); }
    else if(e.key==="End"){ e.preventDefault(); goTo(total-1); }
    else if(e.key==="o" || e.key==="O"){ openOverview(); }
    else if(e.key==="?"){ shortcutsEl.classList.toggle("open"); }
  });

  var touchX = null;
  stage.addEventListener("touchstart", function(e){ touchX = e.touches[0].clientX; }, {passive:true});
  stage.addEventListener("touchend", function(e){
    if(touchX===null) return;
    var dx = e.changedTouches[0].clientX - touchX;
    if(Math.abs(dx) > 60){ dx < 0 ? next() : prev(); }
    touchX = null;
  }, {passive:true});

  buildProgress();
  render();
})();
</script>
